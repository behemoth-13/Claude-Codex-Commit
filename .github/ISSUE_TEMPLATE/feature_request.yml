name: Feature request
description: Suggest an improvement to Claude Commit or Codex Commit.
title: "[Feature]: "
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - Both plugins
        - Claude Commit
        - Codex Commit
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your workflow and the limitation you encounter.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Describe how you would use the improvement.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include your IDE, CLI, or screenshots when relevant.
